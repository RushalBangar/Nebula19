<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula | Real-time Secure Chat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Animated Gradient Orbs Background -->
    <div class="orbs-container">
        <div class="orb orb-purple"></div>
        <div class="orb orb-cyan"></div>
        <div class="orb orb-pink"></div>
    </div>

    <!-- Authentication Screen -->
    <div id="auth-screen" class="screen">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h1 class="gradient-text">Nebula</h1>
                <p class="subtitle">Real-time messaging reimagined</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="auth-form">
                <h2>Welcome Back</h2>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email address">
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password">
                </div>
                <button id="login-btn" class="glow-button">
                    <span>Log In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="auth-divider">
                    <span>TEST MODE</span>
                </div>
                <button id="guest-btn" class="glass-button test-mode-btn" type="button">
                    <i class="fas fa-bolt"></i>
                    <span>⚡ 1-Click Guest Sign-In</span>
                </button>

                <p class="switch-text">
                    Don't have an account? <a href="#" id="show-signup" class="link-gradient">Sign Up</a>
                </p>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="auth-form hidden">
                <h2>Create Account</h2>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="Email address">
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="Password (min 6 characters)">
                </div>
                <button id="signup-btn" class="glow-button">
                    <span>Sign Up</span>
                    <i class="fas fa-user-plus"></i>
                </button>

                <div class="auth-divider">
                    <span>TEST MODE</span>
                </div>
                <button id="guest-btn-signup" class="glass-button test-mode-btn" type="button">
                    <i class="fas fa-bolt"></i>
                    <span>⚡ 1-Click Guest Sign-In</span>
                </button>

                <p class="switch-text">
                    Already have an account? <a href="#" id="show-login" class="link-gradient">Log In</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="screen hidden">
        <div class="glass-card lobby-card">
            <div class="lobby-header">
                <div class="logo-icon">
                    <i class="fas fa-door-open"></i>
                </div>
                <h1 class="gradient-text">Nebula</h1>
                <p class="user-email" id="user-email-display"></p>
            </div>
            <div class="lobby-content">
                <div class="input-field large">
                    <i class="fas fa-hashtag"></i>
                    <input type="text" id="room-code-input" placeholder="Enter Room Code (e.g., TEAM-A)" required>
                </div>
                <button id="join-room-btn" class="glow-button">
                    <span>Join Room</span>
                    <i class="fas fa-rocket"></i>
                </button>
                <button id="logout-btn-lobby" class="glass-button">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen hidden">
        <div class="chat-glass-container row-layout">
            
            <div class="chat-main-column">
                <!-- Chat Header -->
                <div class="chat-header-glass">
                    <button id="leave-room-btn" class="icon-glass-btn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="room-info">
                        <div class="room-name-wrapper">
                            <h2 id="current-room-name" class="gradient-text">Room</h2>
                            <span class="live-indicator">
                                <span class="pulse-dot"></span>
                                <span class="live-text">LIVE</span>
                            </span>
                        </div>
                        <p class="room-user" id="current-user-email"></p>
                    </div>
                    <button id="logout-btn-chat" class="icon-glass-btn">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>

                <!-- Messages Area -->
                <div id="messages-container" class="messages-area">
                    <div class="messages-wrapper" id="messages-wrapper">
                        <!-- Messages will be dynamically inserted here -->
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-area-floating">
                    <!-- Typing Indicator -->
                    <div id="typing-indicator" class="typing-indicator hidden">
                        <i class="fas fa-ellipsis-h typing-dots"></i>
                        <span id="typing-user-text">Someone is typing...</span>
                    </div>

                    <div class="input-glass-wrapper">
                        <label for="image-upload-input" class="upload-btn" title="Send Image">
                            <i class="fas fa-image"></i>
                        </label>
                        <input type="file" id="image-upload-input" accept="image/*" class="hidden" style="display:none;">
                        <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                        <button id="send-btn" class="send-glow-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div> <!-- End Chat Main Column -->

            <!-- Online Users Sidebar -->
            <div class="chat-sidebar-glass">
                <div class="sidebar-header">
                    <h3><i class="fas fa-users"></i> <span id="online-count">0 Online</span></h3>
                </div>
                <ul id="online-users-list" class="online-users-list">
                    <!-- Dynamic user list -->
                </ul>
            </div>
            
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
    </div>

    <!-- Footer Signature -->
    <footer class="app-footer">
        <p>© 2026 Nebula. Built with <span class="heart">❤️</span> by <strong>Rushal Bangar</strong>.</p>
    </footer>

    <!-- Firebase JS Module -->
    <script type="module" src="script.js?v=11"></script>
</body>

</html>
